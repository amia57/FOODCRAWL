  <!-- LOGIN SECTION -->

  <main>

    <div class="login-container">

      <h1>Welcome Back</h1>

      <p>
        Log in to continue exploring Queens food spots.
      </p>


      <form id="loginForm">

        <input
          type="text"
          id="username"
          placeholder="Username or Email"
          required
        >


        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >


        <button type="submit">
          Log In
        </button>


        <p id="loginMessage"></p>

      </form>


      <p class="signup-text">

        Don't have an account?

        <a href="signup.html">
          Sign Up
        </a>

      </p>

    </div>

  </main>


  <!-- LOGIN JAVASCRIPT -->
