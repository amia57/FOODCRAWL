  <!-- SIGNUP PAGE -->

  <main>

    <div class="signup-container">

      <h1>SIGN UP</h1>


      <form id="signupForm">

        <label for="name">
          Name
        </label>

        <input
          type="text"
          id="name"
          placeholder="Insert name"
          required
        >


        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Insert email"
          required
        >


        <label for="username">
          Username
        </label>

        <input
          type="text"
          id="username"
          placeholder="Insert username"
          required
        >


        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Insert password"
          required
        >


        <button type="submit">
          Create Account
        </button>


        <p id="signupMessage"></p>

      </form>


      <p class="login-text">

        Already have an account?

        <a href="login.html">
          Log In
        </a>

      </p>

    </div>

  </main>


  <!-- SIGNUP JAVASCRIPT -->
